---
- name: Update Homebrew metadata
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: "{{ upgrade_system_packages | default(false) | bool }}"

- name: Install common command-line tools with Homebrew
  community.general.homebrew:
    name:
      - ansible-lint
      - coreutils
      - fd
      - fzf
      - gh
      - git
      - go
      - httpie
      - libpq
      - n
      - neovim
      - pandoc
      - ripgrep
      - ssh-copy-id
      - tmux
      - typst
      - watch
      - wget
    state: present
  tags:
    - install
    - macosx

- name: Install macOS applications with Homebrew
  community.general.homebrew_cask:
    name:
      - adobe-acrobat-reader
      - discord
      - docker-desktop
      - firefox
      - font-fira-code
      - font-inconsolata-nerd-font
      - ghostty
      - gimp
      - google-chrome
      - google-chrome@canary
      - handbrake-app
      - inkscape
      - iterm2
      - keepassxc
      - kindle
      - kitty
      - meld
      - ngrok
      - scapple
      - spotify
      - vlc
      - wireshark-app
    state: present
  tags:
    - install
    - macosx

- name: Refresh Quick Look plugins
  ansible.builtin.command: qlmanage -r
  changed_when: false

- name: Use fast keyboard repeat rates
  ansible.builtin.command: "defaults write -g {{ item.key }} -int {{ item.value }}"
  loop:
    - { key: InitialKeyRepeat, value: 15 }
    - { key: KeyRepeat, value: 2 }
  changed_when: false

- name: Disable the app launch confirmation dialog
  ansible.builtin.command: defaults write com.apple.LaunchServices LSQuarantine -bool false
  changed_when: false

- name: Automatically hide the Dock
  ansible.builtin.command: defaults write com.apple.dock autohide -bool true
  changed_when: false

- name: Enable tap to click
  ansible.builtin.command: "{{ item }}"
  loop:
    - defaults write com.apple.driver.AppleBluetoothMultitouch.trackpad Clicking -bool true
    - defaults -currentHost write NSGlobalDomain com.apple.mouse.tapBehavior -int 1
    - defaults write NSGlobalDomain com.apple.mouse.tapBehavior -int 1
  changed_when: false
