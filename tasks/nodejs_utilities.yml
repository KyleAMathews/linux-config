---
- name: Check for the n-managed Node.js installation
  ansible.builtin.stat:
    path: "{{ user_home }}/.n/bin/node"
  register: n_node
  when: ansible_facts.os_family == "Darwin"

- name: Install the latest Node.js LTS release with n
  ansible.builtin.command:
    argv:
      - n
      - lts
  environment:
    N_PREFIX: "{{ user_home }}/.n"
  changed_when: true
  when:
    - ansible_facts.os_family == "Darwin"
    - not n_node.stat.exists or upgrade_system_packages | default(false) | bool

- name: Set the npm installation paths
  ansible.builtin.set_fact:
    npm_executable: "{{ user_home + '/.n/bin/npm' if ansible_facts.os_family == 'Darwin' else 'npm' }}"
    npm_prefix: "{{ user_home + '/.n' if ansible_facts.os_family == 'Darwin' else user_home + '/.npm-global' }}"

- name: Ensure the user npm prefix exists
  ansible.builtin.file:
    path: "{{ npm_prefix }}"
    state: directory
    mode: "0755"
  when: ansible_facts.os_family != "Darwin" or not ansible_check_mode or (n_node.stat.exists | default(false))

- name: Configure npm to use the user-owned prefix
  ansible.builtin.command:
    argv:
      - "{{ npm_executable }}"
      - config
      - set
      - prefix
      - "{{ npm_prefix }}"
  environment:
    PATH: "{{ npm_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false
  when: ansible_facts.os_family != "Darwin" or not ansible_check_mode or (n_node.stat.exists | default(false))

- name: Install Node.js command-line utilities
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: "{{ 'latest' if upgrade_system_packages | default(false) | bool else 'present' }}"
    executable: "{{ npm_executable }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ npm_prefix }}"
    PATH: "{{ npm_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  loop:
    - "@fsouza/prettierd"
    - eslint_d
    - pnpm
    - prettier
    - typescript
  when: ansible_facts.os_family != "Darwin" or not ansible_check_mode or (n_node.stat.exists | default(false))
