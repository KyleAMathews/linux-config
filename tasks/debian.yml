---
- name: Update apt metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Upgrade Debian packages when requested
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  become: true
  when: upgrade_system_packages | default(false) | bool

- name: Install common Debian packages
  ansible.builtin.apt:
    name:
      - autoconf
      - automake
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - doxygen
      - fd-find
      - fzf
      - gettext
      - git
      - glances
      - golang-go
      - g++
      - httpie
      - libpng-dev
      - libtool
      - libtool-bin
      - luajit
      - neovim
      - ninja-build
      - pkg-config
      - python3
      - python3-debian
      - python3-pip
      - ripgrep
      - silversearcher-ag
      - smem
      - tmux
      - ufw
      - unzip
      - zsh
    state: present
  become: true
  tags: install

- name: Ensure the local binary directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Link the Debian fdfind binary as fd
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: "{{ user_home }}/.local/bin/fd"
    state: link

- name: Add the NodeSource Node.js 24 repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: https://deb.nodesource.com/node_24.x
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  become: true
  notify: Refresh apt metadata
  tags: nodejs

- name: Apply NodeSource repository changes
  ansible.builtin.meta: flush_handlers
  tags: nodejs

- name: Install Node.js 24 LTS
  ansible.builtin.apt:
    name: nodejs
    state: present
  become: true
  tags: nodejs

- name: Install efm language server
  ansible.builtin.command:
    argv:
      - go
      - install
      - github.com/mattn/efm-langserver@latest
  environment:
    GOPATH: "{{ user_home }}/gocode"
  changed_when: false

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true
  when: configure_ufw | default(false) | bool

- name: Enable ufw when requested
  community.general.ufw:
    state: enabled
  become: true
  when: configure_ufw | default(false) | bool
